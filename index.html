    <meta name="theme-color" content="#fff7ed" />

    <!-- Resolves the theme before first paint: without this the page paints
         light and then snaps to dark once React mounts, which is worst
         exactly for the people who chose dark. Stays in sync with
         src/utils/theme.ts — same storage key, same fallback to the OS. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("xogame_theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#181524" : "#fff7ed");
          }
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
