<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf7ff" />

    <!-- Resolves the theme before first paint: without this the page paints
         light and then snaps to dark once React mounts, which is worst
         exactly for the people who chose dark. Stays in sync with
         src/utils/theme.ts — same storage key, same fallback to the OS. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("xogame_theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#181524" : "#fbf7ff");
          }
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <!-- Comfortaa is bundled from @fontsource (see src/main.tsx) instead of
         Google Fonts: loading it from Google sent every visitor's IP address
         to servers abroad, and the render-blocking cross-origin stylesheet
         slowed the first paint. -->

    <!-- Icons. Yandex's favicon robot may pick any of these ("робот может
         выбрать любую"), so every one of them is a full, valid icon:
         SVG (Yandex's recommended format), a 120×120 PNG (its recommended
         raster size), and a 16/32/48 ICO for old browsers. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="/favicon-120x120.png?v=3" type="image/png" sizes="120x120" />
    <link rel="icon" href="/favicon.ico?v=3" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest?v=3" />

    <!-- Everything from the page title down to the end of the JSON-LD block

         at build time. Keep it contiguous, and keep language-neutral tags

    />

    <link rel="canonical" href="https://xo-game.online/" />

  <body>
    <div id="root"></div>

    <!-- Yandex.Metrika counter -->
    <!--
      Loaded only with the visitor's consent. Metrika sets cookies and sees
      the IP address, which under 152-FZ is processing personal data, so
      nothing is fetched from Yandex until "Принять" is pressed in the
      cookie banner (src/components/CookieConsent) or the choice is stored
      from an earlier visit. src/utils/analyticsConsent.ts owns the storage
      key and calls window.__xoLoadMetrika() when consent is given later.
      The <noscript> tracking pixel is gone for the same reason: without JS
      there is no way to ask first.
    -->
    <script type="text/javascript">
      window.__xoLoadMetrika = function () {
        if (window.__xoMetrikaLoaded) {
          return;
        }
        window.__xoMetrikaLoaded = true;

        (function (m, e, t, r, i, k, a) {
          m[i] =
            m[i] ||
            function () {
              (m[i].a = m[i].a || []).push(arguments);
            };
          m[i].l = 1 * new Date();
          for (var j = 0; j < document.scripts.length; j++) {
            if (document.scripts[j].src === r) {
              return;
            }
          }
          k = e.createElement(t);
          a = e.getElementsByTagName(t)[0];
          k.async = 1;
          k.src = r;
          a.parentNode.insertBefore(k, a);
        })(
          window,
          document,
          "script",
          "https://mc.yandex.ru/metrika/tag.js?id=109419714",
          "ym",
        );

        ym(109419714, "init", {
          ssr: true,
          // Session recording stays off: it captured the chat and players'
          // names, which the site otherwise never stores.
          webvisor: false,
          clickmap: true,
          ecommerce: "dataLayer",
          referrer: document.referrer,
          url: location.href,
          accurateTrackBounce: true,
          trackLinks: true,
        });
      };

      try {
        if (localStorage.getItem("xogame_analytics_consent") === "granted") {
          window.__xoLoadMetrika();
        }
      } catch (e) {
        // Storage blocked: no stored consent, so Metrika stays off.
      }
    </script>
    <!-- /Yandex.Metrika counter -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
